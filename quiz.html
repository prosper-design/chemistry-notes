<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz - ChemLab</title>
  <meta name="description" content="Test your chemistry knowledge with interactive quizzes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 3h6v8l4 9H5l4-9V3z"/>
            <path d="M9 3h6"/>
          </svg>
        </div>
        <span>ChemLab</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="notes.html">Notes</a></li>
        <li><a href="quiz.html" class="active">Quiz</a></li>
      </ul>
      <button class="mobile-menu-btn" aria-label="Toggle menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- Page Header -->
  <header class="page-header">
    <div class="container">
      <h1>Chemistry Quiz</h1>
      <p>Test your knowledge and track your progress</p>
    </div>
  </header>

  <!-- Quiz Content -->
  <main class="quiz-container container">
    <!-- Progress Bar -->
    <div class="quiz-progress">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
      </div>
      <span class="progress-text" id="progress-text">0 / 10</span>
    </div>

    <!-- Quiz Card -->
    <div class="quiz-card" id="quiz-card">
      <div id="question-container">
        <p class="question-number" id="question-number">Question 1</p>
        <h3 class="question-text" id="question-text">Loading question...</h3>
        <div class="options-list" id="options-list">
          <!-- Options will be inserted by JavaScript -->
        </div>
      </div>

      <div class="quiz-actions">
        <button class="btn btn-secondary" id="prev-btn" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5"/>
            <path d="M12 19l-7-7 7-7"/>
          </svg>
          Previous
        </button>
        <button class="btn btn-primary" id="next-btn">
          Next
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14"/>
            <path d="M12 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Results (hidden by default) -->
    <div class="quiz-card quiz-result" id="quiz-result" style="display: none;">
      <h2>Quiz Complete!</h2>
      <p class="result-score" id="result-score">0%</p>
      <p class="result-message" id="result-message">Great effort!</p>
      <div class="hero-buttons">
        <button class="btn btn-primary" id="retry-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 4v6h6"/>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
          </svg>
          Try Again
        </button>
        <a href="notes.html" class="btn btn-secondary">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
          Review Notes
        </a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-content">
      <p>Built for students who love chemistry</p>
      <p>ChemLab 2024</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
